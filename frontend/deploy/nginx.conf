# Isogloss gateway: the speaker map (built frontend) + reverse proxy to the API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Hashed build assets can be cached forever; index.html never.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;          # NER over the whole archive takes a few seconds
        client_max_body_size 16m;         # a minute of 16 kHz WAV is ~2 MB; the API caps uploads at 8 MB
        add_header X-Request-ID $request_id always;
    }

    # The original analyser UI, which the API serves at its own root.
    location = /classic { return 301 /classic/; }
    location = /classic/ { proxy_pass http://api:8000/; }
    location /static/ { proxy_pass http://api:8000; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;   # hash routes, but deep links must still load the app
    }
}
