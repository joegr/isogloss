<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isogloss — speakers</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%232a78d6' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%23eb6834'/></svg>" />
  </head>
  <body>
    <nav class="rail" aria-label="Main">
      <a class="rail-brand" href="#/" aria-label="Isogloss home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="rail-name">Iso<b>gloss</b></span>
      </a>
      <a class="rail-link active" href="#/" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
        <span>Speakers</span>
      </a>
      <a class="rail-link" href="/classic/" title="The original analyser: record, analyse, geolocate">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h2l2-6 3 12 3-9 2 3h4"/></svg>
        <span>Analyse</span>
      </a>
      <span class="rail-spacer"></span>
      <button class="rail-link" id="theme-toggle" type="button" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
        <span>Theme</span>
      </button>
    </nav>

    <div id="app" class="page">
      <header class="topbar">
        <div class="page-title">
          <h1>Speakers</h1>
          <span class="brand-sub">one dot per speaker · record → place → entities → audio</span>
        </div>
        <div class="stats" id="stats"></div>
      </header>

      <aside class="panel left" id="input-panel"></aside>

      <main class="center">
        <section class="card map-card" id="map-card">
          <div class="card-head">
            <div class="segmented view-switch" role="group" aria-label="View">
              <button type="button" data-view="globe" class="active">Globe</button>
              <button type="button" data-view="flat">Flat</button>
            </div>
            <div class="map-legend" id="map-legend"></div>
          </div>
          <div class="map" id="map"></div>
        </section>
      </main>

      <aside class="panel right" id="records-panel"></aside>
    </div>
    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
