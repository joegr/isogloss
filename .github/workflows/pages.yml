name: test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --disable-pip-version-check numpy scipy

      - name: Signal chain
        run: python3 backend/tests/test_dsp.py

      - name: Voice round trip
        run: python3 backend/tests/test_voice.py

      # presets.js is generated from the SQL seed. If someone edits the seed and
      # forgets to regenerate, the site silently ships stale varieties — so the
      # check is that regenerating produces no diff.
      - name: Presets are in sync with the seed
        run: |
          python3 web/build_presets.py
          if ! git diff --quiet -- web/presets.js; then
            echo "::error file=web/presets.js::Out of date. Run: python3 web/build_presets.py"
            git diff -- web/presets.js
            exit 1
          fi

      - name: Static site is self-contained
        run: python3 web/check_site.py

  deploy:
    name: deploy to pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The synthesiser is the site root; the speaker map is built into
      # speaker-map/ beside it (the speaker-map job tests it).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: speaker-map/package-lock.json
      - name: Build the speaker map
        working-directory: speaker-map
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          cp -r dist ../web/speaker-map
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  # speaker-map/ is a static frontend for the Demogi/Isogloss backend, which is
  # hosted elsewhere. config.js is its only knowledge of that backend: the build
  # writes it from the API_BASE repository variable (Settings → Secrets and
  # variables → Actions → Variables), so moving the backend is a variable change
  # and a re-run, never a code change. Unset → the page says no backend is
  # configured instead of failing silently.
  speaker-map:
    name: speaker map
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speaker-map
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: speaker-map/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: npm run build
